[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orderbot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "PyOTP>=2.9,<3",
    "PyYAML>=6,<7",
    "pyarrow>=19,<27",
    "requests>=2.32,<3",
    "tzdata",
    "websockets>=15,<18",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.package-data]
"orderbot.core" = ["*.sql"]
"orderbot.reporting.web" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
