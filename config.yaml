runtime:
  mode: paper
  live_enabled: false
  strategy: vwap
  timezone: Asia/Kolkata
market:
  underlying: NIFTY
  signal_series: near_month_futures
  session_open: "09:15"
  session_close: "15:30"
data:
  instrument_master_url: https://margincalculator.angelbroking.com/OpenAPI_File/files/OpenAPIScripMaster.json
  instrument_cache_dir: var/instruments
  instrument_download_timeout_seconds: 30
  history_cache_dir: var/history
  tick_archive_dir: var/ticks
  archive_batch_rows: 256
  archive_flush_seconds: 5
  close_grace_seconds: 2
  rsi_period: 14
  atr_period: 14
  history_attempts: 3
  history_backoff_seconds: 1
  history_backoff_max_seconds: 8
  previous_session_lookback_days: 14
  capture_lead_minutes: 5
  websocket_url: wss://smartapisocket.angelone.in/smart-stream
  websocket_subscription_limit: 1000
  websocket_connect_timeout_seconds: 5
  websocket_poll_seconds: 0.5
  websocket_heartbeat_seconds: 10
  websocket_stale_seconds: 5
  websocket_reconnect_seconds: 30
  websocket_backoff_seconds: 1
  websocket_backoff_max_seconds: 8
options:
  monthly_futures_count: 3
  min_later_trading_sessions: 2
  strike_interval: "50"
  candidate_wings: 2
  max_itm_steps: 1
  max_otm_steps: 0
  min_abs_delta: "0.45"
  target_abs_delta: "0.52"
  max_abs_delta: "0.60"
  min_premium: "50"
  max_premium: "400"
  max_spread_fraction: "0.01"
  max_spread_ticks: 4
  depth_levels: 5
  depth_multiple: 3
  min_open_interest: 1000
  min_day_volume: 500
  quote_max_age_seconds: 5
  max_requote_mid_fraction: "0.003"
  quantity_freeze_units: 1800
  expiry_close: "15:30"
  annual_rate: "0.06"
  dividend_yield: "0.01"
  maximum_iv: "5"
  iv_price_tolerance: "0.000001"
  iv_max_iterations: 80
  broker_delta_tolerance: "0.05"
risk:
  capital_inr: null
  risk_per_trade_pct: null
  max_open_positions: 1
  max_premium_deployed_pct: "25"
  max_entries_per_day: 5
  daily_loss_limit_pct: "2"
  max_consecutive_losses: 3
  max_round_trip_friction_pct: "25"
costs:
  brokerage_per_order_inr: "20"
  stt_sell_rate: "0.0015"
  stt_exercise_rate: "0.0015"
  exchange_including_ipft_rate: "0.0003553"
  sebi_rate: "0.000001"
  stamp_buy_rate: "0.00003"
  gst_rate: "0.18"
  slippage_ticks: 1
execution:
  max_entry_premium: "400"
  partial_timeout_seconds: 10
  timeout_lookup_delay_seconds: 1
  reconcile_interval_seconds: 60
  paper_rejection_pct: "1"
  paper_rejection_seed: 0
strategy_a:
  consolidation_band: "0.005"
  consolidation_lookback: 5
  consolidation_max_near: 1
  volume_lookback: 20
  volume_multiple: "1.5"
  rsi_long_band: ["40", "70"]
  rsi_short_band: ["30", "60"]
  require_pivot: false
  pivot_tolerance: "0.0025"
  entry_open: "09:30"
  entry_close: "14:45"
  expiry_entry_close: "12:00"
  iv_lookback_sessions: 20
  iv_percentile: "80"
  cooldown_minutes: 15
  k_sl: "2"
  k_tgt: "4"
  max_premium_loss_fraction: "0.35"
exits:
  square_off_time: "15:10"
  backstop_time: "15:20"
  expiry_force_exit_minutes: 60
  stall_minutes: 20
  max_hold_minutes: 120
  stall_minimum_r: "0.5"
  break_even_r: "1"
  trail_start_r: "2"
  trail_peak_fraction: "0.50"
  long_exit_rsi: "70"
  short_exit_rsi: "30"
  reprice_seconds: 2
  reprice_extra_ticks: [0, 1, 2]
  paper_protection_fraction: "0.025"
kill_switch:
  rejection_limit: 3
  max_clock_drift_seconds: "2"
  volatility_window_minutes: 5
  volatility_move_fraction: "0.015"
  sentinel_path: var/STOP
storage:
  sqlite_path: var/orderbot.sqlite3
logging:
  level: INFO
  application_path: var/log/application.jsonl
  order_audit_path: var/log/order-audit.jsonl
  rotate_bytes: 10485760
  backup_count: 5
broker:
  provider: angel_one
  base_url: https://apiconnect.angelone.in
  timeout_seconds: 10
  rest_max_requests_per_second: 1
  api_key_env: ANGEL_ONE_API_KEY
  client_code_env: ANGEL_ONE_CLIENT_CODE
  mpin_env: ANGEL_ONE_MPIN
  totp_secret_env: ANGEL_ONE_TOTP_SECRET
  local_ip_env: ANGEL_ONE_LOCAL_IP
  public_ip_env: ANGEL_ONE_PUBLIC_IP
  mac_address_env: ANGEL_ONE_MAC_ADDRESS
